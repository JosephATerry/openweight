name: CI

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Application tests and security hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ""
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      USE_HUB_KERNELS: "0"
      PYTHONPATH: src
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-container.txt
            requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install --requirement requirements-ci.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Verify sanitized public-source boundary
        run: |
          test ! -e data/evals
          test ! -e data/training
          test ! -e mlruns
          test ! -e .env

      - name: Run model-free non-holdout application suite
        run: >-
          python -m pytest -q
          --ignore=tests/test_policy_dataset_v3.py
          --ignore=tests/test_muse_training_compatibility.py

      - name: Validate deterministic Space export
        run: python scripts/export_huggingface_space.py --output "$RUNNER_TEMP/openweight-space"

      - name: Set up Node 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build
          npm audit --audit-level=high

      - name: Audit production dependencies
        run: pip-audit --requirement requirements-container.txt --progress-spinner off

      - name: Scan sanitized public repository for secrets
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

  container:
    name: Container build and safe smoke test
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: openweight-d11-ci-smoke
      OPENWEIGHT_API_PORT: "18011"
      POSTGRES_HOST_PORT: "55434"
      POSTGRES_DB: openweight_ci
      POSTGRES_USER: openweight_ci
      POSTGRES_PASSWORD: local-ci-placeholder # pragma: allowlist secret
      OPENWEIGHT_TRACING_ENABLED: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build production application image
        run: docker compose build api

      - name: Start isolated smoke environment
        run: docker compose up --detach --wait --wait-timeout 180 postgres api

      - name: Verify safe service endpoints
        run: |
          curl --fail --silent --show-error http://127.0.0.1:18011/healthz >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:18011/readyz >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:18011/v1/service-info >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:18011/ | grep -q '<title>OpenWeight'
          curl --fail --silent --show-error http://127.0.0.1:18011/system | grep -q '<title>OpenWeight'
          curl --fail --silent --show-error \
            --dump-header /tmp/openweight-metrics.headers \
            --output /tmp/openweight-metrics.body \
            http://127.0.0.1:18011/metrics
          grep -qi '^content-type:.*text/plain' /tmp/openweight-metrics.headers
          grep -q 'openweight_http_requests_total' /tmp/openweight-metrics.body

      - name: Clean isolated smoke environment
        if: ${{ always() }}
        run: docker compose down --volumes --remove-orphans
