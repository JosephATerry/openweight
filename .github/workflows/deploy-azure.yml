name: Deploy Azure Container App

"on":
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      auth_only:
        description: Verify GitHub OIDC authentication to Azure without building or deploying
        required: true
        default: false
        type: boolean
      build_only:
        description: Build and push a model-free migration image without deploying or starting it
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  azure-auth-smoke:
    name: Verify GitHub OIDC authentication only
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.auth_only &&
      !inputs.build_only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    environment:
      name: azure-production
    env:
      AZURE_CORE_OUTPUT: none
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - name: Authenticate to Azure with GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify the authenticated Azure context read-only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AZURE_SUBSCRIPTION_ID"
          test "$AZURE_RESOURCE_GROUP" = "rg-owp-demo-cus"
          available_subscription_count="$(az account list --refresh --query "[?id=='${AZURE_SUBSCRIPTION_ID}'] | length(@)" --output tsv --only-show-errors)"
          active_subscription_id="$(az account show --query id --output tsv)"
          principal_type="$(az account show --query user.type --output tsv)"
          test "$available_subscription_count" = "1"
          test "$active_subscription_id" = "$AZURE_SUBSCRIPTION_ID"
          test "$principal_type" = "servicePrincipal"
          echo "read-only Azure Resource Manager verification: PASS"
          echo "subscription verification: PASS"
          echo "configured service-principal verification: PASS"
          echo "configured resource-group target verification: PASS"
          echo "OIDC authentication smoke test: PASS"

  deploy:
    name: Publish immutable image and deploy current main
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.build_only &&
      !inputs.auth_only) ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: azure-production
      url: ${{ steps.release.outputs.application_url }}
    env:
      AZURE_CORE_OUTPUT: none
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
      AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
      IMAGE_REPOSITORY: openweight-platform-api
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Authorize the requested Azure operation
        id: authorization
        env:
          AUTH_ONLY_REQUESTED: ${{ inputs.auth_only }}
          BUILD_ONLY_REQUESTED: ${{ inputs.build_only }}
          AZURE_BUILD_ENABLED: ${{ vars.AZURE_BUILD_ENABLED }}
          AZURE_DEPLOY_ENABLED: ${{ vars.AZURE_DEPLOY_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          authorized=false
          operation=none

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && \
                "$BUILD_ONLY_REQUESTED" == "true" && \
                "$AUTH_ONLY_REQUESTED" != "true" ]]; then
            operation=build_only
            if [[ "$AZURE_BUILD_ENABLED" == "true" ]]; then
              authorized=true
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            operation=deploy
            if [[ "$AZURE_DEPLOY_ENABLED" == "true" ]]; then
              authorized=true
            fi
          fi

          echo "authorized=$authorized" >> "$GITHUB_OUTPUT"
          echo "operation=$operation" >> "$GITHUB_OUTPUT"
          if [[ "$authorized" == "true" ]]; then
            echo "Azure ${operation} authorization gate: PASS"
          else
            echo "Azure ${operation} authorization gate: CLOSED"
          fi

      - name: Check out the CI-validated revision
        if: ${{ steps.authorization.outputs.authorized == 'true' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Confirm revision is still current main
        if: ${{ steps.authorization.outputs.authorized == 'true' }}
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          remote_sha="$(git ls-remote "https://github.com/${REPOSITORY}.git" refs/heads/main | cut -f1)"
          test "$SOURCE_SHA" = "$remote_sha"

      - name: Authenticate to Azure with GitHub OIDC
        if: ${{ steps.authorization.outputs.authorized == 'true' }}
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify the narrowly configured Azure targets
        if: ${{ steps.authorization.outputs.authorized == 'true' }}
        run: |
          test -n "$AZURE_RESOURCE_GROUP"
          test -n "$AZURE_CONTAINER_REGISTRY"
          test -n "$AZURE_CONTAINER_APP"
          az acr show --name "$AZURE_CONTAINER_REGISTRY" --resource-group "$AZURE_RESOURCE_GROUP" --only-show-errors --output none
          if [[ "${{ github.event_name }}" != "workflow_dispatch" || "${{ inputs.build_only }}" != "true" ]]; then
            az containerapp show --name "$AZURE_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" --only-show-errors --output none
          fi

      - name: Build and push the production image
        id: image
        if: ${{ steps.authorization.outputs.authorized == 'true' }}
        run: |
          login_server="$(az acr show --name "$AZURE_CONTAINER_REGISTRY" --resource-group "$AZURE_RESOURCE_GROUP" --query loginServer --output tsv)"
          image_tag="${login_server}/${IMAGE_REPOSITORY}:${SOURCE_SHA}"
          preload_demo_embeddings=true
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.build_only }}" == "true" ]]; then
            preload_demo_embeddings=false
          fi
          az acr login --name "$AZURE_CONTAINER_REGISTRY" --only-show-errors
          docker build \
            --platform linux/amd64 \
            --build-arg VITE_DEMO_MODE=true \
            --build-arg "OPENWEIGHT_PRELOAD_DEMO_EMBEDDINGS=${preload_demo_embeddings}" \
            --build-arg "OPENWEIGHT_BUILD_SHA=${SOURCE_SHA}" \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --tag "$image_tag" \
            .
          docker push "$image_tag"
          digest="$(az acr repository show --name "$AZURE_CONTAINER_REGISTRY" --image "${IMAGE_REPOSITORY}:${SOURCE_SHA}" --query digest --output tsv)"
          test "${#digest}" -eq 71
          immutable_image="${login_server}/${IMAGE_REPOSITORY}@${digest}"
          echo "immutable_image=$immutable_image" >> "$GITHUB_OUTPUT"

      - name: Stop after migration image publication
        if: >-
          steps.authorization.outputs.authorized == 'true' &&
          github.event_name == 'workflow_dispatch' && inputs.build_only
        run: |
          echo "## Azure model-free migration image" >> "$GITHUB_STEP_SUMMARY"
          echo "Image pushed by immutable digest without model preload; no Terraform, job, database, or Container App action occurred." >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.image.outputs.immutable_image }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy one digest-pinned Container App revision
        id: release
        if: >-
          steps.authorization.outputs.authorized == 'true' &&
          github.event_name == 'workflow_run'
        env:
          IMMUTABLE_IMAGE: ${{ steps.image.outputs.immutable_image }}
        run: |
          previous_revision="$(az containerapp show --name "$AZURE_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.latestReadyRevisionName --output tsv)"
          revision_suffix="sha-${SOURCE_SHA:0:7}"
          az containerapp update \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$IMMUTABLE_IMAGE" \
            --revision-suffix "$revision_suffix" \
            --only-show-errors \
            --output none
          new_revision="$(az containerapp show --name "$AZURE_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.latestRevisionName --output tsv)"
          fqdn="$(az containerapp show --name "$AZURE_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.configuration.ingress.fqdn --output tsv)"
          test -n "$new_revision"
          test -n "$fqdn"
          echo "previous_revision=$previous_revision" >> "$GITHUB_OUTPUT"
          echo "new_revision=$new_revision" >> "$GITHUB_OUTPUT"
          echo "application_url=https://${fqdn}" >> "$GITHUB_OUTPUT"

      - name: Wait for the new revision and verify safe endpoints
        if: >-
          steps.authorization.outputs.authorized == 'true' &&
          github.event_name == 'workflow_run'
        env:
          IMMUTABLE_IMAGE: ${{ steps.image.outputs.immutable_image }}
          NEW_REVISION: ${{ steps.release.outputs.new_revision }}
          APPLICATION_URL: ${{ steps.release.outputs.application_url }}
        run: |
          for attempt in {1..30}; do
            running_state="$(az containerapp revision show --name "$AZURE_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" --revision "$NEW_REVISION" --query properties.runningState --output tsv)"
            health_state="$(az containerapp revision show --name "$AZURE_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" --revision "$NEW_REVISION" --query properties.healthState --output tsv)"
            if [[ "$running_state" == "Running" && "$health_state" == "Healthy" ]]; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              exit 1
            fi
            sleep 10
          done
          deployed_image="$(az containerapp revision show --name "$AZURE_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" --revision "$NEW_REVISION" --query "properties.template.containers[?name=='api'].image | [0]" --output tsv)"
          test "$deployed_image" = "$IMMUTABLE_IMAGE"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "${APPLICATION_URL}/healthz" >/dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "${APPLICATION_URL}/readyz" >/dev/null

      - name: Record revision and rollback information
        if: >-
          always() && steps.authorization.outputs.authorized == 'true' &&
          steps.release.outcome != 'skipped'
        env:
          PREVIOUS_REVISION: ${{ steps.release.outputs.previous_revision }}
        run: |
          echo "## Azure Container App release" >> "$GITHUB_STEP_SUMMARY"
          echo "New revision: \`${{ steps.release.outputs.new_revision }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Previous ready revision: \`${{ steps.release.outputs.previous_revision }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Immutable image: \`${{ steps.image.outputs.immutable_image }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Application: ${{ steps.release.outputs.application_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Rollback is a reviewed activation/traffic switch to the previous ready revision; this workflow never performs it automatically." >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$PREVIOUS_REVISION" ]]; then
            echo '```bash' >> "$GITHUB_STEP_SUMMARY"
            echo "az containerapp revision activate --name '$AZURE_CONTAINER_APP' --resource-group '$AZURE_RESOURCE_GROUP' --revision '$PREVIOUS_REVISION'" >> "$GITHUB_STEP_SUMMARY"
            echo "az containerapp ingress traffic set --name '$AZURE_CONTAINER_APP' --resource-group '$AZURE_RESOURCE_GROUP' --revision-weight '$PREVIOUS_REVISION=100'" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
