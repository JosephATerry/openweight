name: Deploy Azure Container App

"on":
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      auth_only:
        description: Verify GitHub OIDC authentication to Azure without building or deploying
        required: true
        default: false
        type: boolean
      build_only:
        description: Build and push a model-free migration image without deploying or starting it
        required: true
        default: false
        type: boolean
      indexing_image:
        description: Preload the pinned public Qwen embedding model for an explicit build-only indexing image
        required: true
        default: false
        type: boolean
      deploy_runtime:
        description: Build and deploy a pinned-Qwen runtime image after successful exact-SHA CI
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  azure-auth-smoke:
    name: Verify GitHub OIDC authentication only
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.auth_only &&
      !inputs.build_only &&
      !inputs.indexing_image &&
      !inputs.deploy_runtime
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    environment:
      name: azure-production
    env:
      AZURE_CORE_OUTPUT: none
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - name: Authenticate to Azure with GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify the authenticated Azure context read-only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AZURE_SUBSCRIPTION_ID"
          test "$AZURE_RESOURCE_GROUP" = "rg-owp-demo-cus"
          available_subscription_count="$(az account list --refresh --query "[?id=='${AZURE_SUBSCRIPTION_ID}'] | length(@)" --output tsv --only-show-errors)"
          active_subscription_id="$(az account show --query id --output tsv)"
          principal_type="$(az account show --query user.type --output tsv)"
          test "$available_subscription_count" = "1"
          test "$active_subscription_id" = "$AZURE_SUBSCRIPTION_ID"
          test "$principal_type" = "servicePrincipal"
          echo "read-only Azure Resource Manager verification: PASS"
          echo "subscription verification: PASS"
          echo "configured service-principal verification: PASS"
          echo "configured resource-group target verification: PASS"
          echo "OIDC authentication smoke test: PASS"

  deploy:
    name: Publish immutable image and deploy current main
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.build_only &&
      !inputs.auth_only && !inputs.deploy_runtime) ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_runtime &&
      !inputs.auth_only && !inputs.build_only && !inputs.indexing_image) ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: azure-production
      url: ${{ steps.release.outputs.application_url }}
    env:
      AZURE_CORE_OUTPUT: none
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
      AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
      AZURE_FRONTEND_STORAGE_ACCOUNT: ${{ vars.AZURE_FRONTEND_STORAGE_ACCOUNT }}
      AZURE_FRONTEND_URL: ${{ vars.AZURE_FRONTEND_URL }}
      IMAGE_REPOSITORY: openweight-platform-api
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Authorize the requested Azure operation
        id: authorization
        env:
          AUTH_ONLY_REQUESTED: ${{ inputs.auth_only }}
          BUILD_ONLY_REQUESTED: ${{ inputs.build_only }}
          INDEXING_IMAGE_REQUESTED: ${{ inputs.indexing_image }}
          DEPLOY_RUNTIME_REQUESTED: ${{ inputs.deploy_runtime }}
          AZURE_BUILD_ENABLED: ${{ vars.AZURE_BUILD_ENABLED }}
          AZURE_DEPLOY_ENABLED: ${{ vars.AZURE_DEPLOY_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          authorized=false
          operation=none
          image_flavor=model_free

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && \
                "$BUILD_ONLY_REQUESTED" == "true" && \
                "$AUTH_ONLY_REQUESTED" != "true" && \
                "$DEPLOY_RUNTIME_REQUESTED" != "true" ]]; then
            operation=build_only
            if [[ "$INDEXING_IMAGE_REQUESTED" == "true" ]]; then
              operation=indexing_image
              image_flavor=indexing
            fi
            if [[ "$AZURE_BUILD_ENABLED" == "true" ]]; then
              authorized=true
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && \
                  "$DEPLOY_RUNTIME_REQUESTED" == "true" && \
                  "$AUTH_ONLY_REQUESTED" != "true" && \
                  "$BUILD_ONLY_REQUESTED" != "true" && \
                  "$INDEXING_IMAGE_REQUESTED" != "true" ]]; then
            operation=deploy
            image_flavor=runtime
            if [[ "$AZURE_BUILD_ENABLED" == "true" && \
                  "$AZURE_DEPLOY_ENABLED" == "true" ]]; then
              authorized=true
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            operation=deploy
            if [[ "$AZURE_DEPLOY_ENABLED" == "true" ]]; then
              authorized=true
            fi
          fi

          echo "authorized=$authorized" >> "$GITHUB_OUTPUT"
          echo "operation=$operation" >> "$GITHUB_OUTPUT"
          echo "image_flavor=$image_flavor" >> "$GITHUB_OUTPUT"
          if [[ "$authorized" == "true" ]]; then
            echo "Azure ${operation} authorization gate: PASS"
          else
            echo "Azure ${operation} authorization gate: CLOSED"
          fi

      - name: Check out the CI-validated revision
        if: ${{ steps.authorization.outputs.authorized == 'true' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Confirm revision is still current main
        if: ${{ steps.authorization.outputs.authorized == 'true' }}
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          remote_sha="$(git ls-remote "https://github.com/${REPOSITORY}.git" refs/heads/main | cut -f1)"
          test "$SOURCE_SHA" = "$remote_sha"

      - name: Confirm manual runtime revision passed exact-SHA CI
        if: >-
          steps.authorization.outputs.authorized == 'true' &&
          github.event_name == 'workflow_dispatch' && inputs.deploy_runtime
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          ci_conclusion="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --proto '=https' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --get \
              --data-urlencode "head_sha=${SOURCE_SHA}" \
              --data-urlencode 'per_page=100' \
              "${GITHUB_API_URL}/repos/${REPOSITORY}/actions/runs" |
            jq -er \
              --arg sha "$SOURCE_SHA" \
              '[.workflow_runs[] | select(.name == "CI" and .event == "push" and .head_branch == "main" and .head_sha == $sha and .conclusion == "success")] | length'
          )"
          test "$ci_conclusion" -ge 1
          echo "Exact-SHA push CI verification: PASS"

      - name: Authenticate to Azure with GitHub OIDC
        if: ${{ steps.authorization.outputs.authorized == 'true' }}
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify the narrowly configured Azure targets
        id: targets
        if: ${{ steps.authorization.outputs.authorized == 'true' }}
        run: |
          set -euo pipefail
          test -n "$AZURE_RESOURCE_GROUP"
          test -n "$AZURE_CONTAINER_REGISTRY"
          test -n "$AZURE_CONTAINER_APP"
          [[ "$AZURE_CONTAINER_REGISTRY" =~ ^[a-z0-9]{5,50}$ ]]
          acr_login_suffix="$(az cloud show --query suffixes.acrLoginServerEndpoint --output tsv)"
          test "$acr_login_suffix" = ".azurecr.io"
          login_server="${AZURE_CONTAINER_REGISTRY}${acr_login_suffix}"
          echo "login_server=$login_server" >> "$GITHUB_OUTPUT"
          if [[ "${{ steps.authorization.outputs.operation }}" == "deploy" ]]; then
            [[ "$AZURE_FRONTEND_STORAGE_ACCOUNT" =~ ^[a-z0-9]{3,24}$ ]]
            [[ "$AZURE_FRONTEND_URL" =~ ^https://[a-z0-9.-]+$ ]]
          fi
          if [[ "${{ github.event_name }}" != "workflow_dispatch" || "${{ inputs.build_only }}" != "true" ]]; then
            az containerapp show --name "$AZURE_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" --only-show-errors --output none
          fi

      - name: Authenticate Docker directly to the ACR data plane
        id: registry-auth
        if: ${{ steps.authorization.outputs.authorized == 'true' }}
        env:
          ACR_LOGIN_SERVER: ${{ steps.targets.outputs.login_server }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          DOCKER_CONFIG: ${{ runner.temp }}/openweight-docker-config
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077

          token_response="$(mktemp "${RUNNER_TEMP}/openweight-acr-token.XXXXXX.json")"
          trap 'rm -f "$token_response"' EXIT
          mkdir -p "$DOCKER_CONFIG"
          chmod 0700 "$DOCKER_CONFIG"

          az account get-access-token \
            --resource https://containerregistry.azure.net \
            --query accessToken \
            --output tsv \
            --only-show-errors |
          curl \
            --fail \
            --silent \
            --show-error \
            --proto '=https' \
            --request POST \
            --url "https://${ACR_LOGIN_SERVER}/oauth2/exchange" \
            --data-urlencode "grant_type=access_token" \
            --data-urlencode "service=${ACR_LOGIN_SERVER}" \
            --data-urlencode "tenant=${AZURE_TENANT_ID}" \
            --data-urlencode "access_token@-" \
            --output "$token_response"

          jq -er \
            '.refresh_token | select(type == "string" and length > 0)' \
            "$token_response" |
          docker login "$ACR_LOGIN_SERVER" \
            --username 00000000-0000-0000-0000-000000000000 \
            --password-stdin
          rm -f "$token_response"
          echo "ACR data-plane authentication: PASS"

      - name: Build and push the production image
        id: image
        if: ${{ steps.authorization.outputs.authorized == 'true' }}
        env:
          ACR_LOGIN_SERVER: ${{ steps.targets.outputs.login_server }}
          DOCKER_CONFIG: ${{ runner.temp }}/openweight-docker-config
          IMAGE_FLAVOR: ${{ steps.authorization.outputs.image_flavor }}
        run: |
          set -euo pipefail
          umask 077
          preload_demo_embeddings=false
          tag_suffix=""
          case "$IMAGE_FLAVOR" in
            model_free) ;;
            indexing)
              preload_demo_embeddings=true
              tag_suffix="-indexing"
              ;;
            runtime)
              preload_demo_embeddings=true
              tag_suffix="-runtime"
              ;;
            *)
              echo "Unsupported image flavor" >&2
              exit 1
              ;;
          esac
          image_tag="${ACR_LOGIN_SERVER}/${IMAGE_REPOSITORY}:${SOURCE_SHA}${tag_suffix}"
          metadata_file="$(mktemp "${RUNNER_TEMP}/openweight-build-metadata.XXXXXX.json")"
          trap 'rm -f "$metadata_file"' EXIT
          docker buildx build \
            --platform linux/amd64 \
            --build-arg VITE_DEMO_MODE=true \
            --build-arg "OPENWEIGHT_PRELOAD_DEMO_EMBEDDINGS=${preload_demo_embeddings}" \
            --build-arg "OPENWEIGHT_BUILD_SHA=${SOURCE_SHA}" \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --tag "$image_tag" \
            --push \
            --metadata-file "$metadata_file" \
            .
          digest="$(jq -er \
            '.["containerimage.digest"] | select(type == "string" and test("^sha256:[0-9a-f]{64}$"))' \
            "$metadata_file")"
          immutable_image="${ACR_LOGIN_SERVER}/${IMAGE_REPOSITORY}@${digest}"
          echo "immutable_image=$immutable_image" >> "$GITHUB_OUTPUT"

      - name: Remove ephemeral registry credentials
        if: >-
          always() && steps.authorization.outputs.authorized == 'true' &&
          steps.registry-auth.outcome != 'skipped'
        env:
          ACR_LOGIN_SERVER: ${{ steps.targets.outputs.login_server }}
          DOCKER_CONFIG: ${{ runner.temp }}/openweight-docker-config
        shell: bash
        run: |
          set +e
          docker logout "$ACR_LOGIN_SERVER" >/dev/null 2>&1
          rm -rf -- "$DOCKER_CONFIG"

      - name: Stop after build-only image publication
        if: >-
          steps.authorization.outputs.authorized == 'true' &&
          github.event_name == 'workflow_dispatch' && inputs.build_only
        run: |
          if [[ "${{ steps.authorization.outputs.image_flavor }}" == "indexing" ]]; then
            echo "## Azure model-enabled indexing image" >> "$GITHUB_STEP_SUMMARY"
            echo "Pinned public Qwen embeddings were preloaded at build time; no Terraform, job, database, or Container App action occurred." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Azure model-free migration image" >> "$GITHUB_STEP_SUMMARY"
            echo "Image pushed by immutable digest without model preload; no Terraform, job, database, or Container App action occurred." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.image.outputs.immutable_image }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy one digest-pinned Container App revision
        id: release
        if: >-
          steps.authorization.outputs.authorized == 'true' &&
          (github.event_name == 'workflow_run' ||
          (github.event_name == 'workflow_dispatch' && inputs.deploy_runtime))
        env:
          IMMUTABLE_IMAGE: ${{ steps.image.outputs.immutable_image }}
        run: |
          previous_revision="$(az containerapp show --name "$AZURE_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.latestReadyRevisionName --output tsv)"
          revision_suffix="sha-${SOURCE_SHA:0:7}"
          az containerapp update \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$IMMUTABLE_IMAGE" \
            --revision-suffix "$revision_suffix" \
            --only-show-errors \
            --output none
          new_revision="$(az containerapp show --name "$AZURE_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.latestRevisionName --output tsv)"
          fqdn="$(az containerapp show --name "$AZURE_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.configuration.ingress.fqdn --output tsv)"
          test -n "$new_revision"
          test -n "$fqdn"
          echo "previous_revision=$previous_revision" >> "$GITHUB_OUTPUT"
          echo "new_revision=$new_revision" >> "$GITHUB_OUTPUT"
          echo "application_url=https://${fqdn}" >> "$GITHUB_OUTPUT"

      - name: Wait for the new revision and verify safe endpoints
        if: >-
          steps.authorization.outputs.authorized == 'true' &&
          (github.event_name == 'workflow_run' ||
          (github.event_name == 'workflow_dispatch' && inputs.deploy_runtime))
        env:
          IMMUTABLE_IMAGE: ${{ steps.image.outputs.immutable_image }}
          NEW_REVISION: ${{ steps.release.outputs.new_revision }}
          APPLICATION_URL: ${{ steps.release.outputs.application_url }}
        run: |
          for attempt in {1..30}; do
            running_state="$(az containerapp revision show --name "$AZURE_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" --revision "$NEW_REVISION" --query properties.runningState --output tsv)"
            health_state="$(az containerapp revision show --name "$AZURE_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" --revision "$NEW_REVISION" --query properties.healthState --output tsv)"
            if [[ "$health_state" == "Healthy" && \
                  ( "$running_state" == "Running" || \
                    "$running_state" == "RunningAtMaxScale" ) ]]; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              exit 1
            fi
            sleep 10
          done
          deployed_image="$(az containerapp revision show --name "$AZURE_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" --revision "$NEW_REVISION" --query "properties.template.containers[?name=='api'].image | [0]" --output tsv)"
          test "$deployed_image" = "$IMMUTABLE_IMAGE"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "${APPLICATION_URL}/healthz" >/dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "${APPLICATION_URL}/readyz" >/dev/null

      - name: Set up the Azure static frontend build
        if: >-
          steps.authorization.outputs.authorized == 'true' &&
          steps.release.outcome == 'success'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the independently hosted Azure frontend
        if: >-
          steps.authorization.outputs.authorized == 'true' &&
          steps.release.outcome == 'success'
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ steps.release.outputs.application_url }}
          VITE_COLD_START_GATE: "true"
          VITE_DEMO_MODE: "true"
          VITE_STATIC_HOSTING: "true"
        run: |
          npm ci --ignore-scripts
          npm run build
          test -f dist/index.html
          test -d dist/assets

      - name: Publish the Azure static frontend with OIDC
        id: frontend
        if: >-
          steps.authorization.outputs.authorized == 'true' &&
          steps.release.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          az storage blob upload-batch \
            --account-name "$AZURE_FRONTEND_STORAGE_ACCOUNT" \
            --auth-mode login \
            --destination '$web' \
            --source frontend/dist \
            --pattern 'assets/*' \
            --overwrite true \
            --content-cache-control 'public, max-age=31536000, immutable' \
            --only-show-errors \
            --output none
          az storage blob upload \
            --account-name "$AZURE_FRONTEND_STORAGE_ACCOUNT" \
            --auth-mode login \
            --container-name '$web' \
            --file frontend/dist/index.html \
            --name index.html \
            --overwrite true \
            --content-type 'text/html; charset=utf-8' \
            --content-cache-control 'no-cache, max-age=0, must-revalidate' \
            --only-show-errors \
            --output none
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "${AZURE_FRONTEND_URL}/" >/dev/null
          echo "frontend_url=$AZURE_FRONTEND_URL" >> "$GITHUB_OUTPUT"

      - name: Record revision and rollback information
        if: >-
          always() && steps.authorization.outputs.authorized == 'true' &&
          steps.release.outcome != 'skipped'
        env:
          PREVIOUS_REVISION: ${{ steps.release.outputs.previous_revision }}
        run: |
          echo "## Azure Container App release" >> "$GITHUB_STEP_SUMMARY"
          echo "New revision: \`${{ steps.release.outputs.new_revision }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Previous ready revision: \`${{ steps.release.outputs.previous_revision }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Immutable image: \`${{ steps.image.outputs.immutable_image }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Application: ${{ steps.release.outputs.application_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Static frontend: ${{ steps.frontend.outputs.frontend_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Rollback is a reviewed activation/traffic switch to the previous ready revision; this workflow never performs it automatically." >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$PREVIOUS_REVISION" ]]; then
            echo '```bash' >> "$GITHUB_STEP_SUMMARY"
            echo "az containerapp revision activate --name '$AZURE_CONTAINER_APP' --resource-group '$AZURE_RESOURCE_GROUP' --revision '$PREVIOUS_REVISION'" >> "$GITHUB_STEP_SUMMARY"
            echo "az containerapp ingress traffic set --name '$AZURE_CONTAINER_APP' --resource-group '$AZURE_RESOURCE_GROUP' --revision-weight '$PREVIOUS_REVISION=100'" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
