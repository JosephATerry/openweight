name: Deploy Hugging Face Space

"on":
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: hugging-face-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy approved main revision
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: hugging-face-production
      url: https://josephaterry-openweight.hf.space
    steps:
      - name: Check out the CI-validated revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Confirm revision is still current main
        env:
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          remote_sha="$(git ls-remote "https://github.com/${REPOSITORY}.git" refs/heads/main | cut -f1)"
          test "$SOURCE_SHA" = "$remote_sha"

      - name: Set up Python 3.12.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.11"

      - name: Install pinned Hugging Face CLI
        run: python -m pip install "huggingface_hub==1.27.0"

      - name: Build deterministic Space export
        run: python scripts/export_huggingface_space.py --output "$RUNNER_TEMP/openweight-space"

      - name: Deploy export to josephaterry/openweight
        env:
          HF_OIDC_RESOURCE: spaces/josephaterry/openweight
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          python scripts/deploy_huggingface_space.py
          --export-dir "$RUNNER_TEMP/openweight-space"
          --source-sha "$SOURCE_SHA"
